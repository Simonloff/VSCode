<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reloj Mundial Interactivo</title>
  <!-- Fuente moderna desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="Papu.css">
</head>
<body>
  <header>
    <h1>Reloj Mundial Interactivo</h1>
    <!-- Buscador para filtrar ciudades -->
    <input type="text" id="searchInput" placeholder="Buscar ciudad...">
  </header>

  <main>
    <!-- Sección para seleccionar el criterio de ordenamiento -->
    <section id="sorting-section">
      <label for="sortSelect">Ordenar por: </label>
      <select id="sortSelect">
        <option value="name-asc">Nombre A-Z</option>
        <option value="name-desc">Nombre Z-A</option>
        <option value="pop-asc">Población (menor a mayor)</option>
        <option value="pop-desc">Población (mayor a menor)</option>
      </select>
      <!-- Advertencia de que las poblaciones son estimadas -->
      <p class="note">* Nota: Las poblaciones son estimadas.</p>
    </section>

    <!-- Sección de Favoritos -->
    <section id="favoritos-section">
      <h2 class="section-title">Favoritos</h2>
      <div id="favoritos">
        <!-- Las tarjetas de Favoritos se agregarán aquí -->
      </div>
    </section>

    <!-- Sección de Ciudades -->
    <section id="ciudades-section">
      <h2 class="section-title">Ciudades</h2>
      <div id="ciudades">
        <!-- Las tarjetas de Ciudades se generarán aquí -->
      </div>
    </section>
  </main>

  <!-- Botón para alternar el modo oscuro/claro -->
  <button id="toggleMode">Modo Oscuro/Claro</button>

  <!-- Enlace al archivo JavaScript externo -->
  <script src="Papu2.js"></script>
</body>
</html>
